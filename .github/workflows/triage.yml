# Issues: label by catalog-id prefix in the title ("[T01] ...", "[P03] ...") via github-script
# (actions/labeler only handles PRs). PRs: actions/labeler with the path map in .github/labeler.yml.
name: triage

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-issues:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const areas = {
              T: "area:triggers", D: "area:data", M: "area:monitoring", R: "area:documents",
              A: "area:ai", B: "area:business", O: "area:devops", P: "area:patterns",
            };
            const title = context.payload.issue.title || "";
            const match = title.match(/^\s*\[([TDMRABOP])\d{2}\]/i);
            if (!match) {
              core.info(`no catalog id prefix in "${title}" - nothing to label`);
              return;
            }
            const label = areas[match[1].toUpperCase()];
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [label],
            });
            core.info(`labelled #${context.payload.issue.number} with ${label}`);

  label-prs:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
